name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Run TypeScript typecheck
      run: pnpm run typecheck
    
    - name: Check for explicit .js imports
      run: |
        echo "Checking for missing .js extensions in imports..."
        # Check for relative imports without .js extension
        if grep -r --include="*.ts" --include="*.js" --include="*.mts" -E "import.*from\s+['\"]\.\/.*[^\.js]['\"]" src/; then
          echo "❌ Found imports missing .js extension"
          echo "Please add .js extension to all relative imports for ES module compatibility"
          exit 1
        fi
        echo "✅ All relative imports have explicit .js extensions"